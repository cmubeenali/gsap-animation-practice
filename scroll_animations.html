<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="smooth-wrapper">
        <div id="smooth-content">
            <div
                style="height: 100vh; background-color: red; display: flex; justify-content: center; align-items: center;">
                <div style="width: 100%; text-align: center;">
                    <p class="hero-caption"
                        style="font-family: Arial, Helvetica, sans-serif; font-weight: bold; color: white; font-size: 32px;">
                        GO DIGITAL,</p>
                    <p
                        style="font-family: Arial, Helvetica, sans-serif; font-weight: bold; color: white; font-size: 32px;">
                        GET HIRED!</p>
                </div>
            </div>
            <div class="scroll-anim-section"
                style="height: 100vh; background-color: purple; display: flex; justify-content: center; align-items: center;">
                <div class="content-area"
                    style="width: 60%; background-color: #2c2c2c; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap:10px; border-radius: 10px; height: 500px;">
                    <div style="background-color: #ccc; padding: 20px; text-align: center; border-radius: 10px;">

                    </div>
                </div>
            </div>
            <div
                style="height: 100vh; background-color: orange; display: flex; justify-content: center; align-items: center;">
                <div
                    style="width: 60%; background: none; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap:10px; border-radius: 10px; height: 500px;">
                    <div class="content-item"
                        style="background-color: #ccc; padding: 20px; text-align: center; border-radius: 10px; transform: translate(-60px,0);">

                    </div>
                    <div class="content-item"
                        style="background-color: #ccc; padding: 20px; text-align: center; border-radius: 10px; transform: translate(0px,-60px);">

                    </div>
                    <div class="content-item"
                        style="background-color: #ccc; padding: 20px; text-align: center; border-radius: 10px; transform: translate(20px, 60px);">

                    </div>
                    <div class="content-item"
                        style="background-color: #ccc; padding: 20px; text-align: center; border-radius: 10px; transform: translate(0px,60px);">

                    </div>
                    <div class="content-item"
                        style="background-color: #ccc; padding: 20px; text-align: center; border-radius: 10px;">

                    </div>
                    <div class="content-item"
                        style="background-color: #ccc; padding: 20px; text-align: center; border-radius: 10px; transform: translate(20px,120px);">

                    </div>
                    <div class="content-item"
                        style="background-color: #ccc; padding: 20px; text-align: center; border-radius: 10px; transform: translate(-20px,120px);">

                    </div>
                </div>
            </div>
            <div class="scroll-anim-section"
                style="height: 100vh; background-color: blueviolet; display: flex; justify-content: center; align-items: center;">
                <h3>Section 4</h3>
            </div>
        </div>
    </div>
    <!-- GSAP Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <!-- GSAP ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollSmoother.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger, ScrollSmoother, SplitText);
        let smoother = ScrollSmoother.create({
            wrapper: '#smooth-wrapper',
            content: '#smooth-content',
            smooth: 2,
            smoothTouch: 0.1,
        });

        let splitCaption = SplitText.create('.hero-caption', {
            type: "chars"
        });

        let splitCaptionPara = SplitText.create('.hero-caption-para', {
            type: "chars"
        });

        gsap.from(splitCaption.chars, {
            y: 0,
            x: 10,
            opacity: 1,
            autoAlpha: 0,
            stagger: 0.05
        });
        gsap.from(splitCaptionPara.chars, {
            y: 10,
            x: 0,
            opacity: 1,
            autoAlpha: 0,
            stagger: 0.01,
            scale: 1.2
        });

        gsap.fromTo('.title-bg-img', { scale: 0 }, { scale: 1, duration: 1 });

        gsap.fromTo('.hero-bg-splash', { scale: 0 }, { scale: 1, duration: 1 });

        tl = gsap.timeline({
            scrollTrigger: {
                trigger: '.scroll-anim-section',
                start: "top bottom",
                end: "+=300%",
                toggleActions: "restart none none reverse",
                scrub: true,
                markers: true,
            }
        });

        // tl.fromTo('.marketing-content-section', { scale: 0.6 }, { scale: 1, width: jQuery('.marketing-content-section').width() + 200 });
        // tl.to('.marketing-box-item', {
        //     x: 0
        // }, '<0.2');
        // tl.fromTo('.theory-sec-img', { x: '-500px', opacity: 0 }, { x: 0, opacity: 1 }, '>');
        // tl.fromTo('.practical-sec-img', { x: '880px', opacity: 0 }, { x: 0, opacity: 1 }, '<0');

        // let img = jQuery('.motion-path-character').find('img');
        // console.log(img);
        // gsap.to(img, {
        //     motionPath: {
        //         path: '.path-line',
        //         align: '.path-line',
        //         alignOrigin: [0.5, 0.9], // Keeps the center of the image on the path
        //         autoRotate: false,
        //         start: 0,
        //         end: 0.5,
        //         offsetX: 0,
        //         offsetY: 0,
        //     },
        //     ease: "none",
        //     scrollTrigger: {
        //         trigger: '.path-animation-section',
        //         start: `top bottom`,
        //         end: `+=150%`,
        //         scrub: 1,
        //         pin: false,
        //         pinSpacing: false,
        //         markers: true,
        //     },
        // });

        // tl.to('.content-item', {
        //     x: 0,
        //     y: 0
        // });

        // gsap.to('.gallery-img', {
        //     x:0,
        //     y:0,
        //     scrollTrigger: {
        //         trigger: '.gallery-section',
        //         start: `top bottom`,
        //         end: `+=100%`,
        //         scrub: 1,
        //         pin: false,
        //         pinSpacing: false,
        //         markers: true,
        //     },
        // });

        let getRatio = el => window.innerHeight / (window.innerHeight + el.offsetHeight);

        gsap.utils.toArray(".section").forEach((section, i) => {
            section.bg = section.querySelector(".bg");

            // Give the backgrounds some random images
            section.bg.style.backgroundImage = `url(https://assets.codepen.io/16327/portrait-pattern-${i + 2}.jpg)`;

            // the first image (i === 0) should be handled differently because it should start at the very top.
            // use function-based values in order to keep things responsive
            gsap.fromTo(section.bg, {
                backgroundPosition: () => i ? `50% ${-window.innerHeight * getRatio(section)}px` : "50% 0px"
            }, {
                backgroundPosition: () => `50% ${window.innerHeight * (1 - getRatio(section))}px`,
                ease: "none",
                scrollTrigger: {
                    trigger: section,
                    start: () => i ? "top bottom" : "top top",
                    end: "bottom top",
                    scrub: true,
                    invalidateOnRefresh: true // to make it responsive
                }
            });

        });

    </script>
</body>

</html>
