<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidebar Layout</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            height: 100%;
            font-family: system-ui, sans-serif;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            background-color: #1e1e2f;
            color: white;
            display: flex;
            flex-direction: column;
            width: 250px;
            /* relative-friendly width */
            padding: 1.5rem 1rem;
        }

        .sidebar nav {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .sidebar a {
            color: #b0b0c0;
            text-decoration: none;
        }

        .sidebar a:hover {
            color: white;
        }

        /* Main Section */
        .main-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            background: #f5f6fa;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: white;
            border-bottom: 1px solid #ddd;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .menu-btn {
            display: none;
            /* hidden on desktop, visible on mobile */
            background: none;
            border: none;
            font-size: 1.5rem;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
        }

        /* Main Content */
        .content {
            flex: 1;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background: white;
            border-radius: 0.75rem;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
            padding: 2rem;
        }
    </style>
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <h2>Logo</h2>
            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Projects</a>
                <a href="#">Reports</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <div class="main-container">
            <header class="navbar">
                <div class="nav-left">
                    <button class="menu-btn">☰</button>
                    <h1>Dashboard</h1>
                </div>
                <div class="nav-right">
                    <img src="user.jpg" alt="User" class="avatar" />
                </div>
            </header>

            <main class="content">
                <div class="card">Main content goes here</div>
            </main>
        </div>
    </div>
</body>

</html>
